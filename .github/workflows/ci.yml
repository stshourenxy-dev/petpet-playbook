name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pipeline-test:
    name: 素材管线测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 安装依赖（验证 requirements.txt 本身有效）
        run: pip install -r requirements.txt pytest ruff
      - name: lint（ruff）
        run: ruff check pipeline/ tests/
      - name: 冒烟测试
        run: python tests/smoke_test.py
      - name: 单元测试（边界情况）
        run: pytest tests/test_pipeline.py -v

  viewer-build:
    name: 客户端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: viewer/package-lock.json
      - name: 安装依赖
        run: npm ci
        working-directory: viewer
      - name: 构建（vite build）
        run: npm run build
        working-directory: viewer
      - name: 单元测试（vitest）
        run: npm test
        working-directory: viewer
      - name: 校验构建产物
        run: test -f dist/index.html && echo "✅ dist/index.html 存在" && ls dist/assets/ | head -5
        working-directory: viewer

  viewer-mac-package:
    name: macOS 构建（唯一实测平台，必须覆盖）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: viewer/package-lock.json
      - name: 安装依赖
        run: npm ci
        working-directory: viewer
      - name: 构建渲染层（vite build，含 tsc 类型检查）
        run: npm run build
        working-directory: viewer
      - name: 单元测试（vitest）
        run: npm test
        working-directory: viewer
      - name: 校验 dist 产物
        run: test -f dist/index.html && echo "✅ index.html 存在"
        working-directory: viewer
      - name: 打包 macOS 安装包（dmg）
        run: npx electron-builder --mac 2>&1 | tee dist.log || { tail -50 dist.log; exit 1; }
        working-directory: viewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: PetPet-macos
          path: viewer/release/*.dmg
          if-no-files-found: error

  viewer-win-package:
    name: Windows 安装包构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: viewer/package-lock.json
      - name: 安装依赖
        run: npm ci
        working-directory: viewer
      - name: 构建渲染层（vite build）
        run: npm run build
        working-directory: viewer
      - name: 校验 dist 产物
        shell: pwsh
        run: |
          Get-ChildItem dist
          if (Test-Path dist/index.html) { Write-Host "✅ index.html 存在" } else { Write-Host "❌ index.html 缺失"; exit 1 }
        working-directory: viewer
      - name: 打包 Windows 安装包（nsis + portable）
        shell: bash
        run: |
          npx electron-builder --win 2>&1 | tee dist.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::electron-builder 失败，日志尾部："
            tail -50 dist.log | while IFS= read -r line; do echo "::error::$line"; done
          fi
          echo "::group::electron-builder 日志尾部"
          tail -60 dist.log
          echo "::endgroup::"
          exit $EXIT_CODE
        working-directory: viewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 失败时发布构建日志到 issue（供排查）
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('viewer/dist.log') ? fs.readFileSync('viewer/dist.log', 'utf8').slice(-4000) : '（无日志文件）';
            const body = '## Windows 打包失败日志（自动上报）\n```\n' + log + '\n```';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            let issue = issues.find(i => i.title === 'CI Windows 打包失败日志');
            if (issue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'CI Windows 打包失败日志',
                body
              });
            }
      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: PetPet-windows
          path: |
            viewer/release/*.exe
            viewer/release/*.blockmap
          if-no-files-found: error
